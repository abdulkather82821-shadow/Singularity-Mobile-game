# Builds the Android APK and the Windows executable on GitHub's runners.
# Start it from the Actions tab ("Run workflow") or push to main.
# Artifacts appear under the run's "Artifacts" section.
name: Build binaries

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    name: Windows .exe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates ]; then
            mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/SINGULARITY.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SINGULARITY-windows
          path: build/windows/SINGULARITY.exe
          if-no-files-found: error

  android:
    name: Android .apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates ]; then
            mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Probe Android toolchain
        run: |
          echo "::warning::ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset} JAVA_HOME=${JAVA_HOME:-unset}"
          echo "::warning::keytool=$(command -v keytool || echo missing) sdkmanager=$(command -v sdkmanager || echo missing)"
          echo "::warning::sdk dirs: $(ls -d /root/android-sdk /opt/android-sdk /usr/lib/android-sdk /root/Android/Sdk 2>/dev/null | tr '\n' ' ')"

      - name: Debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            if ! command -v keytool >/dev/null 2>&1; then
              echo "::error::keytool not found in the container - no JDK for signing"
              exit 1
            fi
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg
          echo "::warning::preset: $(grep 'keystore/debug' export_presets.cfg | tr '\n' ' ')"

      - name: Export Android build
        run: |
          mkdir -p build/android
          set +e
          OUTPUT=$(godot --headless --path . --export-debug "Android" build/android/SINGULARITY.apk 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            MSG=$(echo "$OUTPUT" | grep -iE "error|cannot|missing|invalid|unable|fail" | tail -n 6 | tr '\n' '|' | cut -c1-900)
            echo "::error::APK export failed (exit $CODE): $MSG"
            exit $CODE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SINGULARITY-android
          path: build/android/SINGULARITY.apk
          if-no-files-found: error
