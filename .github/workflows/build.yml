# Builds the Windows executable and the Android APK on GitHub's runners.
# Start it from the Actions tab ("Run workflow") or push to main / an arena branch.
# Results are attached to the run as downloadable artifacts.
name: Build binaries

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]

jobs:
  windows:
    name: Windows .exe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates ]; then
            mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/SINGULARITY.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SINGULARITY-windows
          path: build/windows/SINGULARITY.exe
          if-no-files-found: error

  android:
    name: Android .apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates ]; then
            mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Probe Android toolchain
        run: |
          echo "::warning::ANDROID_HOME=${ANDROID_HOME:-unset} JAVA_HOME=${JAVA_HOME:-unset}"
          if command -v java >/dev/null 2>&1; then
            DETECTED=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
            echo "JAVA_HOME=$DETECTED" >> "$GITHUB_ENV"
            echo "::warning::java found at $DETECTED"
          else
            echo "::warning::no java on PATH"
          fi
          echo "::warning::keytool=$(command -v keytool || echo missing)"
          echo "::warning::sdk platforms: $(ls /usr/lib/android-sdk/platforms 2>/dev/null | tr '\n' ' ')"
          echo "::warning::sdk build-tools: $(ls /usr/lib/android-sdk/build-tools 2>/dev/null | tr '\n' ' ')"

      - name: Debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l "$KEYSTORE"
          python3 tools/ci_patch_android_preset.py "$KEYSTORE"
          grep -E "^keystore/" export_presets.cfg

      - name: Export Android build
        run: |
          mkdir -p build/android
          set +e
          OUTPUT=$(godot --headless --path . --export-debug "Android" build/android/SINGULARITY.apk 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            MSG=$(echo "$OUTPUT" | grep -iE "error|cannot|missing|invalid|unable|fail|keystore|sdk" | tail -n 6 | tr '\n' '|' | cut -c1-900)
            echo "::error::APK export failed (exit $CODE): $MSG"
            exit $CODE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SINGULARITY-android
          path: build/android/SINGULARITY.apk
          if-no-files-found: error
